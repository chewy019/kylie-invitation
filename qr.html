<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8d2947">
  <title>Your Kylie’s Debut QR Code</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; color: #492633; background: #fff8fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px 16px; display: grid; place-items: center; }
    main { width: min(100%, 460px); padding: 30px 24px; text-align: center; background: #fff; border: 1px solid #efd9e0; border-radius: 24px; box-shadow: 0 18px 50px #68253a18; }
    .eyebrow { margin: 0 0 9px; color: #a6405d; font: 700 11px/1.4 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; color: #7e2542; font-size: clamp(27px, 7vw, 34px); font-weight: 500; }
    .description { margin: 12px auto 22px; color: #704b58; font: 14px/1.65 Arial, sans-serif; }
    #qr-frame { display: grid; min-height: 286px; place-items: center; margin: 0 auto 20px; padding: 16px; border: 1px solid #f0dfe4; border-radius: 18px; background: #fff; }
    #qrcode { display: grid; place-items: center; width: 256px; max-width: 100%; min-height: 256px; }
    #qrcode img, #qrcode canvas { display: block; width: 256px !important; height: 256px !important; max-width: 100%; image-rendering: pixelated; }
    .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; width: 100%; padding: 12px 20px; border: 0; border-radius: 999px; background: #8d2947; color: white; font: 700 13px Arial, sans-serif; text-decoration: none; cursor: pointer; }
    .button:hover { background: #70213a; }
    .link { display: inline-block; margin-top: 16px; color: #8d2947; font: 700 12px Arial, sans-serif; text-decoration: underline; text-underline-offset: 3px; }
    #error { color: #a72e44; }
    #qrcode:empty { display: none; }
    @media (max-width: 360px) { main { padding: 24px 16px; } #qr-frame { min-height: 250px; } #qrcode, #qrcode img, #qrcode canvas { width: 220px !important; height: 220px !important; min-height: 220px; } }
  </style>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="./qr.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Kylie’s 18th Birthday Debut</p>
    <h1>Your personal QR code</h1>
    <p class="description">Show this code at the venue for check-in. You can also save it to your phone.</p>
    <section id="qr-content">
      <div id="qr-frame"><div aria-label="Personal invitation QR code" id="qrcode" role="img"></div></div>
      <button class="button" id="download-qr" type="button">Save QR code to my device</button>
      <a class="link" href="#" id="open-invitation">Open my invitation</a>
    </section>
    <p class="description" hidden id="error" role="alert">This QR code link is invalid. Please open the link from your email or ask the host to resend it.</p>
  </main>
</body>
</html>
